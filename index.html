<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סמכויות החובש — שאלות לבדיקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F1;--card:#fff;--ink:#1B211C;--muted:#66706A;--olive:#3F4E34;--olive-soft:#E4E9DC;--ok:#1C6B44;--ok-soft:#E2F1E7;--bad:#8F3A34;--bad-soft:#F7E6E3;--line:#D9DDD4;--sand:#F6F1E3;--sand-line:#D9C98F}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;font-size:16px;line-height:1.55}
button,input,textarea{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
header{background:var(--olive);color:#F3F5EE;padding:22px 0 18px}
header h1{margin:0;font-size:clamp(22px,4vw,30px);font-weight:800;line-height:1.2}
header .sub{margin:4px 0 0;font-size:14px;opacity:.85;font-weight:300}
.bar{position:sticky;top:0;z-index:5;background:rgba(243,245,241,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:8px;padding-bottom:8px}
.bar input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#fff;font-size:14px;width:130px}
.bar input:focus,.bar button:focus-visible,.card button:focus-visible{outline:2px solid var(--sand-line);outline-offset:1px}
.bar button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--olive)}
.bar .sync{font-size:12px;color:var(--muted);margin-inline-start:auto}
.bar .sync.bad{color:var(--bad)}
main{padding:16px 0 70px}
.tot{font-size:13px;color:var(--muted);margin:2px 0 12px}
details.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
details.day>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:700;font-size:18px}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary .n{font-size:12px;font-weight:500;color:var(--olive);background:var(--olive-soft);padding:2px 8px;border-radius:5px;white-space:nowrap}
details.day>summary .cnt{margin-inline-start:auto;font-size:13px;font-weight:400;color:var(--muted);white-space:nowrap}
details.day>summary .cnt b{color:var(--ok);font-weight:500}
details.day>summary .cnt i{color:var(--bad);font-style:normal;font-weight:500}
details.day>summary .chev{width:10px;height:10px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none}
details.day[open]>summary .chev{transform:rotate(135deg)}
details.day[open]>summary{border-bottom:1px solid var(--line)}
.body{padding:10px 12px 6px}
.card{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;background:#fff;border-inline-start:4px solid var(--line)}
.card.ok{border-inline-start-color:var(--ok)}
.card.fix{border-inline-start-color:var(--bad)}
.card .top{display:flex;gap:10px;align-items:flex-start;padding:12px 14px 2px}
.card .num{font-size:12px;color:var(--muted);min-width:34px;padding-top:4px}
.card .qt{margin:0;font-weight:500;font-size:17px;line-height:1.4;flex:1}
.card .pen{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 4px;border-radius:5px;line-height:1}
.card .pen:hover{background:var(--olive-soft);color:var(--olive)}
.opts{list-style:none;margin:4px 14px 0 14px;padding:0}
.opts li{display:flex;gap:8px;padding:5px 8px;border-radius:6px;margin:2px 0}
.opts li .l{color:var(--muted);font-weight:500;min-width:18px}
.opts li.c{background:var(--ok-soft);font-weight:500;color:#173F2C}
details.ex{margin:6px 14px 0}
details.ex>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--olive);padding:4px 0;display:inline-flex;gap:6px;align-items:center}
details.ex>summary::-webkit-details-marker{display:none}
details.ex>summary::before{content:"";width:7px;height:7px;border-inline-start:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details.ex[open]>summary::before{transform:rotate(135deg)}
.why{margin:4px 0 0;padding:0;list-style:none}
.why li{display:flex;gap:8px;padding:5px 8px;font-size:14px;color:var(--muted);border-radius:6px}
.why li .l{min-width:18px;font-weight:500}
.why li.c{color:#173F2C;background:var(--ok-soft)}
.src{margin:8px 0 4px;padding:8px 12px;background:var(--sand);border-inline-start:3px solid var(--sand-line);border-radius:0 6px 6px 0;font-size:13.5px}
.src .ref{display:block;font-size:12px;color:#7A6A35;margin-bottom:2px}
.foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px 12px;border-top:1px dashed var(--line);margin-top:8px}
.foot button{border:1px solid var(--line);background:#fff;padding:4px 11px;border-radius:6px;cursor:pointer;font-size:14px}
.foot button.on-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.foot button.on-fix{background:var(--bad);color:#fff;border-color:var(--bad)}
.foot input{flex:1;min-width:150px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:14px}
.foot .meta{width:100%;font-size:11.5px;color:var(--muted)}
.edited{font-size:11px;color:var(--olive);background:var(--olive-soft);padding:1px 7px;border-radius:4px;white-space:nowrap}
/* editor */
.ed{padding:12px 14px 14px}
.ed label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
.ed textarea,.ed input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:15px;background:#fff}
.ed textarea{resize:vertical;min-height:40px}
.ed .row{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;margin:6px 0;padding:8px;border-radius:8px;border:1px solid var(--line)}
.ed .row.c{border-color:var(--ok);background:var(--ok-soft)}
.ed .row input[type=radio]{margin-top:10px;accent-color:var(--ok)}
.ed .row textarea{margin-top:5px;font-size:14px;min-height:34px}
.ed .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ed .btns button{border:1px solid var(--olive);background:var(--olive);color:#fff;padding:7px 16px;border-radius:7px;cursor:pointer}
.ed .btns button.ghost{background:#fff;color:var(--olive)}
.ed .btns button.warn{background:#fff;color:var(--bad);border-color:var(--bad);margin-inline-start:auto}
.ed .hint{font-size:12px;color:var(--muted)}
.ed .hint.over{color:var(--bad)}
#login{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#login.hide{display:none}
#login .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 26px;width:100%;max-width:360px;text-align:center}
#login h2{margin:0 0 4px;font-size:20px;font-weight:800;color:var(--olive)}
#login p{margin:0 0 18px;font-size:14px;color:var(--muted)}
#login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:20px;text-align:center;letter-spacing:.2em;direction:ltr}
#login input:focus{outline:2px solid var(--sand-line)}
#login button{width:100%;margin-top:12px;border:0;background:var(--olive);color:#fff;border-radius:8px;padding:12px;font-size:16px;font-weight:500;cursor:pointer}
#login .err{min-height:20px;font-size:13px;color:var(--bad);margin-top:10px}
@media (max-width:600px){.card .top{padding:10px 10px 2px}.opts,details.ex{margin-inline:10px}.foot{padding-inline:10px}.bar .sync{width:100%;margin:0}}
@media print{.bar,.foot,.pen{display:none}details{open:true}}
</style>
</head>
<body>
<div id="login" class="hide"><div class="box"><h2>סמכויות החובש</h2><p>שאלות לבדיקה</p><input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="סיסמה"><button id="go">כניסה</button><div class="err" id="pwerr"></div></div></div>
<header><div class="wrap"><h1>סמכויות החובש — שאלות לבדיקה</h1><p class="sub">הוראת קרפ"ר 200.001 · יולי 2025</p></div></header>
<div class="bar"><div class="wrap">
<input id="who" placeholder="שם הבודק">
<input id="tok" type="hidden"><button id="lock" title="סיסמה">🔒</button>
<button id="tog">פתח הכל</button>
<button id="exp">ייצוא</button>
<span class="sync" id="sync"></span>
</div></div>
<main><div class="wrap">
<div class="tot" id="stat"></div>
<div id="root"></div>
</div></main>
<script>
const DAY1 = {day:1, title:"מי אני ומה מותר לי", sub:"הגדרות, מדרג סמכות, תיעוד, טפסים ונהלים כלליים", qs:[
{q:`מי מוסמך להסמיך חייל למקצוע החובש?`,
 o:[`מפקד היחידה`,`מפקד בית הספר לרפואה צבאית`,`קצין הרפואה הראשי`,`רופא היחידה`], c:1,
 w:[`מפקד היחידה אינו גורם מקצועי רפואי ואין לו סמכות הסמכה למקצוע.`,`ההוראה קובעת במפורש שהסמכת חייל למקצוע החובש נתונה בידי מפקד ביה"ס לרפואה צבאית (בה"ד 10), בתום הקורס.`,`קרפ"ר מוציא את ההוראה וקובע מדיניות, אך ההסמכה עצמה מבוצעת ע"י מפקד ביה"ס.`,`רופא היחידה מדריך ומפקח, אך אינו מסמיך למקצוע.`],
 s:[`פרק "רקע"`,`הסמכת חייל למקצוע החובש נתונה בידי מפקד בית הספר לרפואה צבאית.`]},
{q:`חניך בקורס חובשים — מתי רשאי לבצע פעולות שבסמכות חובש?`,
 o:[`אף פעם, עד סיום הקורס`,`בנוכחות ותחת השגחת מדריך חר"פ`,`אחרי שבועיים בקורס`,`בהוראת מפקד הקורס`], c:1,
 w:[`ההוראה מאפשרת לחניך לבצע פעולות בתנאי השגחה — לא אוסרת לחלוטין.`,`ההגדרות קובעות שהפעולות יכולות להתבצע ע"י חניך, ובלבד שהדבר ייעשה בנוכחותו ותחת השגחתו של מדריך חר"פ.`,`אין בהוראה סף זמן בקורס; התנאי הוא השגחה, לא ותק.`,`מפקד הקורס אינו תחליף למדריך חר"פ הנוכח ומשגיח בפועל.`],
 s:[`פרק "הגדרות"`,`הפעולות שבסמכות החובש... יכולות להתבצע על ידי חניך ב"קורס חובשים", ובלבד שהדבר יעשה בנוכחותו ותחת השגחתו של מדריך חר"פ.`]},
{q:`מהו מדרג "הסמכות הרפואית" לפי ההוראה?`,
 o:[`רופא, פרמדיק, אח, חובש`,`רופא, אח, פרמדיק, חובש`,`פרמדיק, רופא, אח, חובש`,`לפי דרגה צבאית`], c:1,
 w:[`הסדר שגוי — האח קודם לפרמדיק במדרג.`,`ההגדרה בהוראה: רופא, אח, פרמדיק וחובש, בהתאם לשלב ההכשרה. זה הסדר שקובע מי הסמכות הבכירה בשטח ועם מי מתייעצים.`,`הרופא הוא תמיד הסמכות הבכירה ביותר.`,`המדרג הוא מקצועי-רפואי ואינו תלוי בדרגה צבאית.`],
 s:[`פרק "הגדרות" — "סמכות רפואית"`,`סגל רפואי לפי המדרג הבא: רופא, אח, פרמדיק וחובש, בהתאם לשלב ההכשרה (כמפורט בנספח א' להוראה זו).`]},
{q:`מי מוגדר "מטפל בכיר" (מט"ב)?`,
 o:[`כל רופא`,`רופא או פרמדיק לאחר הכשרת MTLS`,`אח`,`חובש בשלב 10 ומעלה`], c:1,
 w:[`לא כל רופא — נדרשת הכשרת MTLS.`,`ההגדרה: רופא או פרמדיק לאחר הכשרת MTLS. זה הגורם שהחובש עובד תחתיו בטראומה ומקבל ממנו הוראות לפלזמה, הפסקת החייאה ועוד.`,`אח אינו נכלל בהגדרת מט"ב.`,`חובש, בכל שלב, אינו מט"ב.`],
 s:[`פרק "הגדרות" — "מטפל בכיר"`,`"מטפל בכיר" (מט"ב) – רופא או פרמדיק לאחר הכשרת MTLS.`]},
{q:`אין ביחידה רופא, אח או פרמדיק. מה מעמד ההמלצה הרפואית של החובש כלפי המפקד?`,
 o:[`המלצה בלבד, המפקד מחליט`,`הוראה מחייבת את הסגל הפיקודי`,`תלוי בדרגת המפקד`,`דורשת אישור מקרפ"ר`], c:1,
 w:[`ההוראה מעלה את ההמלצה למעמד של הוראה מחייבת בהעדר סמכות בכירה יותר.`,`בהיעדר סמכות רפואית בכירה יותר, כל המלצה רפואית של החובש היא הוראה המחייבת את הסגל הפיקודי, כמפורט בפ"מ 61.0104. זו הסיבה שהחובש חייב לדווח אם הוראותיו לא מולאו.`,`הדרגה הצבאית אינה רלוונטית לסמכות הרפואית.`,`אין צורך באישור נוסף; ההוראה מחייבת מעצם ההגדרה.`],
 s:[`פרק "טיפול רפואי על ידי חובש"`,`בהיעדר סמכות רפואית בכירה יותר, תהיה כל המלצה רפואית של החובש הוראה המחייבת את הסגל הפיקודי, כמפורט בפ"מ 61.0104 "טיפול רפואי בחייל".`]},
{q:`חובש נתקל במקרה של ספק. עם מי עליו להתייעץ?`,
 o:[`עם המפקד`,`עם רופא, ובהעדר רופא — עם אח`,`עם חובש ותיק יותר`,`לפעול לפי שיקול דעתו`], c:1,
 w:[`המפקד אינו סמכות רפואית.`,`ההוראה מדגישה: בכל מקרה של ספק, על החובש להיוועץ ברופא, או באח בהעדר רופא. זה עיקרון שחוזר בכל ההוראה.`,`חובש ותיק אינו סמכות רפואית בכירה יותר במדרג.`,`דווקא במצב ספק ההוראה שוללת פעולה עצמאית ומחייבת התייעצות.`],
 s:[`פרק "טיפול רפואי על ידי חובש"`,`בכל מקרה של ספק, על החובש להיוועץ ברופא או אח (בהעדר רופא).`]},
{q:`באיזו תדירות תבוצע בדיקת חובש לחיילים המעוניינים בכך?`,
 o:[`פעם בשבוע`,`מדי יום`,`רק במסדר חולים`,`לפי החלטת המפקד`], c:1,
 w:[`תדירות שבועית אינה עומדת בדרישה.`,`ההוראה קובעת שבדיקת חובש תבוצע מידי יום לחיילים אשר מעוניינים בכך.`,`מסדר חולים הוא בדיקת רופא, לא בדיקת חובש.`,`התדירות קבועה בהוראה ואינה נתונה לשיקול המפקד.`],
 s:[`פרק "טיפול רפואי על ידי חובש"`,`בדיקת חובש תבוצע מידי יום לחיילים אשר מעוניינים בכך.`]},
{q:`נודע לחובש שהמפקד לא מילא את הוראותיו הרפואיות. מה עליו לעשות?`,
 o:[`כלום, זו אחריות המפקד`,`לערב רמה רפואית ממונה`,`להתלונן למפקד הגדוד`,`לתעד בלבד ולהמשיך`], c:1,
 w:[`ההוראה מטילה על החובש אחריות אקטיבית במצב כזה.`,`באחריות החובש לערב רמה רפואית ממונה כשנודע לו שהוראותיו לא מולאו ע"י הסגל הפיקודי. הערוץ הוא רפואי, לא פיקודי.`,`הערוץ שנקבע הוא הרמה הרפואית הממונה, לא שרשרת הפיקוד.`,`תיעוד לבדו אינו מספיק — נדרש עירוב גורם רפואי.`],
 s:[`פרק "טיפול רפואי על ידי חובש"`,`באחריות החובש לערב רמה רפואית ממונה, היה ונודע לו כי הוראותיו לא מולאו על ידי הסגל הפיקודי.`]},
{q:`מי אחראי לביצוע פינוי רפואי, ומי מחליט על הפינוי?`,
 o:[`שניהם — החובש`,`ביצוע — מפקד היחידה; החלטה — הסמכות הרפואית הבכירה`,`שניהם — מפקד היחידה`,`ביצוע — נהג; החלטה — רופא בלבד`], c:1,
 w:[`החובש אינו אחראי על הביצוע הלוגיסטי (רכב, נהג, כוח אדם).`,`ההוראה מפרידה בבירור: האחריות לביצוע מוטלת על מפקד היחידה, וההחלטה (יעד, דחיפות, אופן, ליווי) נתונה בידי הסמכות הרפואית הבכירה ביותר ביחידה — ובהעדר רופא/אח/פרמדיק זה החובש.`,`המפקד אינו מחליט על הצורך הרפואי בפינוי ולא על דחיפותו.`,`ההחלטה אינה "רופא בלבד" — בהעדרו היא של אח, פרמדיק או חובש.`],
 s:[`פרק "פינוי רפואי"`,`האחריות לביצוע פינוי רפואי של חייל מוטלת על מפקד היחידה. ההחלטה על פינוי רפואי... נתונה בידי הסמכות הרפואית הבכירה ביותר ביחידה באותה עת, לרבות קביעת יעד הפינוי, דחיפות הפינוי, אופן הפינוי והליווי הרפואי הנדרש.`]},

{q:`נכון או לא: חובש רשאי להוציא צנתר וריד שהוכנס כחלק מטיפול, על דעת עצמו.`,
 o:[`נכון`,`לא נכון`], c:1,
 w:[`נדרשת הוראה.`,`נספח ב': חובש רשאי להוציא צנתר וריד שהוכנס כחלק מהטיפול רק בהוראת רופא או פרמדיק. צנתר מתרגול — בנוכחות מי שהוסמך לפקח על תרגול.`],
 s:[`נספח ב' — יצירת גישה ורידית, הערות`,`חובש רשאי להוציא צנתר וריד שהוכנס כחלק מהטיפול בחולה, רק בהוראת רופא או פרמדיק.`]},
{q:`נכון או לא: חובש רשאי לבצע שאיבה (סקשן) דרך האף.`,
 o:[`נכון`,`לא נכון`], c:1,
 w:[`רק דרך הפה.`,`נספח ב' — החייאה: חובש רשאי לבצע שאיבה (סקשן) דרך הפה בלבד.`],
 s:[`נספח ב' — החייאה`,`חובש רשאי לבצע שאיבה (סקשן) דרך הפה בלבד.`]},
{q:`חובש זכר, חיילת עם כאב בחזה במרפאה. האם מבצע אק"ג?`,
 o:[`כן`,`בשגרה לא — אלא אם מדובר במצב חירום רפואי`,`רק בנוכחות חיילת`,`רק בהוראת רופא`], c:1,
 w:[`בשגרה אסור.`,`פרק ההגבלות: חובש זכר אינו רשאי לבצע אק"ג לחיילת. ההגבלות אינן חלות במצבי חירום רפואי כהגדרתם בהו"ק 300.001 — וכאב בחזה הוא מדרג א'. בכל מקרה, הפינוי דחוף.`,`נוכחות חיילת אינה מבטלת את האיסור בשגרה.`,`הוראת רופא אינה החריג שנקבע; החריג הוא מצב חירום.`],
 s:[`פרק "הגבלות ואיסורים"`,`חובש זכר אינו ראשי לבצע בדיקת אק"ג לחיילת... ההגבלות... אינן חלות במצבי חירום רפואי, כהגדרתם בהו"ק 300.001"זכויות החולה בצה"ל".`]},
{q:`חייל מתלונן על כאב אוזן. האם חובש רשאי לבדוק את האוזן באוטוסקופ?`,
 o:[`כן`,`לא — בדיקה חודרנית`,`רק בנוכחות אח`,`כן, אם הכאב חזק`], c:1,
 w:[`אסור.`,`פרק ההגבלות: חובש אינו רשאי לבצע כל בדיקה חודרנית, לרבות אוזניים או גרון. חריג: בנוכחות מכשיר טייטו, רשאי לסייע לחייל בביצוע הבדיקה, בתנאי שרופא מפענח. תלונת אוזניים = 24 שעות.`,`נוכחות אח אינה משנה.`,`עוצמת הכאב אינה משנה.`],
 s:[`פרק "הגבלות ואיסורים"`,`חובש אינו רשאי לבצע כל בדיקה חודרנית, לרבות בדיקת אוזניים או בדיקת גרון.`]},
{q:`חשד לפגיעת אקלים, מדידת חום רקטלי. החיילת מסרבת שתהיה נוכחת חיילת. מה עושים?`,
 o:[`לא מודדים`,`מודדים ללא מלווה — זו זכותה לסרב`,`מודדים עם חייל זכר`,`מפנים ללא מדידה`], c:1,
 w:[`המדידה נדרשת בחשד לפגיעת אקלים.`,`פרק ההגבלות: הבדיקה תבוצע בנוכחות חייל/ת לפי מין הנבדק, אלא אם כן סירב הנבדק לבדיקה בליווי.`,`הליווי הוא לפי מין הנבדק.`,`המדידה היא חלק מהערכת פגיעת אקלים (נספח ה').`],
 s:[`פרק "הגבלות ואיסורים"`,`תבוצע הבדיקה בנוכחות חייל או חיילת, בהתאם למין הנבדק. זאת, אלא אם כן סירב הנבדק לבדיקה בליווי.`]},
{q:`חייל ללא דופק וללא נשימה כבר 40 דקות, אתה לבד. מה מותר לך לקבוע?`,
 o:[`מוות`,`כלום — חובש אינו רשאי לקבוע מוות`,`מוות, אם ה-AED לא מזהה קצב`,`מוות בהוראת מפקד`], c:1,
 w:[`אסור.`,`פרק ההגבלות: חובש אינו רשאי לקבוע מוות. וגם אינו רשאי להפסיק החייאה בפצוע בודד ללא הוראת מט"ב.`,`AED אינו סמכות לקביעת מוות.`,`למפקד אין סמכות רפואית.`],
 s:[`פרק "הגבלות ואיסורים"`,`חובש אינו רשאי לקבוע מוות.`]}
]};
const DAYS=[DAY1,DAY2,DAY3,DAY4,DAY5,FINAL];
const L=["א","ב","ג","ד"];
const REPO="dginzburg10/hovesh-review";
const who=document.getElementById("who"),tok=document.getElementById("tok"),syncEl=document.getElementById("sync");
who.value=localStorage.getItem("hovesh-who")||"";tok.value=localStorage.getItem("hovesh-tok")||"";
who.oninput=()=>localStorage.setItem("hovesh-who",who.value);
const VAULT={"s": "yu5ADj+5G1ggSkgsBNWYcQ==", "iv": "3riKD8WzOH05XzHD", "it": 400000, "ct": "NUJC6iTJufhDiGjL6RGObS3vul2+yT3RkYmDa1tywiHR8ZTTZMLQ56TmeArjrgTfVg84w6cupvw="};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(VAULT.s),iterations:VAULT.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(VAULT.iv)},k,ub(VAULT.ct));
  return new TextDecoder().decode(pt);
}
function askPassword(){
  return new Promise(res=>{
    const box=document.getElementById("login"),pw=document.getElementById("pw"),err=document.getElementById("pwerr"),go=document.getElementById("go");
    box.classList.remove("hide");pw.value="";err.textContent="";setTimeout(()=>pw.focus(),50);
    const done=ok=>{box.classList.add("hide");res(ok)};
    go.onclick=async()=>{
      go.disabled=true;err.textContent="בודק…";
      try{tok.value=await unlock(pw.value.trim());localStorage.setItem("hovesh-tok",tok.value);done(true)}
      catch(e){err.textContent="סיסמה שגויה";pw.value="";pw.focus()}
      go.disabled=false;
    };
    pw.onkeydown=e=>{if(e.key==="Enter")go.click()};
  });
}
document.getElementById("lock").onclick=async()=>{await askPassword();pullAll()};
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fmt=t=>t?new Date(t).toLocaleDateString("he-IL")+" "+new Date(t).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"}):"";
const now=()=>new Date().toISOString();
const setSync=(t,bad)=>{syncEl.textContent=t;syncEl.className="sync"+(bad?" bad":"")};
const hdr=()=>{const h={"Accept":"application/vnd.github+json"};if(tok.value.trim())h["Authorization"]="token "+tok.value.trim();return h};
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));

// ---- generic shared JSON store backed by a file in the repo ----
class Store{
  constructor(file,key){this.file=file;this.key=key;this.sha=null;this.dirty=false;this.t=null;this.data={};try{this.data=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}}
  get api(){return "https://api.github.com/repos/"+REPO+"/contents/"+this.file}
  merge(r){let ch=false;for(const k in r){const a=r[k],b=this.data[k];if(!b||(a.at||"")>(b.at||"")){this.data[k]=a;ch=true}}return ch}
  local(){localStorage.setItem(this.key,JSON.stringify(this.data))}
  async pull(){const r=await fetch(this.api+"?t="+Date.now(),{headers:hdr()});if(r.status===404){this.sha=null;return false}if(!r.ok)throw r.status;const j=await r.json();this.sha=j.sha;const ch=this.merge(JSON.parse(b64d(j.content)||"{}"));this.local();return ch}
  set(k,patch){this.data[k]={...(this.data[k]||{}),...patch,by:who.value||"?",at:now()};this.local();this.dirty=true;clearTimeout(this.t);this.t=setTimeout(()=>this.push(),1200)}
  del(k){this.data[k]={by:who.value||"?",at:now(),deleted:true};this.local();this.dirty=true;clearTimeout(this.t);this.t=setTimeout(()=>this.push(),300)}
  async push(){
    if(!tok.value.trim()){setSync("לא נשמר — לחץ על המנעול להזנת סיסמה",true);return}
    setSync("שומר…");
    for(let i=0;i<3;i++){
      try{
        const g=await fetch(this.api+"?t="+Date.now(),{headers:hdr()});
        if(g.ok){const j=await g.json();this.sha=j.sha;this.merge(JSON.parse(b64d(j.content)||"{}"))}else if(g.status!==404){setSync(g.status===401?"סיסמה שגויה":"שגיאה "+g.status,true);return}
        const body={message:this.file+": "+(who.value||"?")+" "+now(),content:b64e(JSON.stringify(this.data,null,1))};if(this.sha)body.sha=this.sha;
        const p=await fetch(this.api,{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify(body)});
        if(p.ok){this.sha=(await p.json()).content.sha;this.dirty=false;this.local();setSync("נשמר "+fmt(now()).split(" ")[1]);return}
        if(p.status===409||p.status===422)continue;
        setSync(p.status===401?"סיסמה שגויה":"שגיאת שמירה "+p.status,true);return
      }catch(e){setSync("אין חיבור — נשמר מקומית",true);return}
    }
    setSync("התנגשות — נסה שוב",true);
  }
}
const REV=new Store("reviews.json","hovesh-review-v2"),OVR=new Store("questions.json","hovesh-questions-v1");

async function pullAll(){
  try{const a=await REV.pull(),b=await OVR.pull();if(a||b)renderAll();
    setSync(tok.value.trim()?"מסונכרן "+fmt(now()).split(" ")[1]:"קריאה בלבד");}
  catch(s){setSync(!tok.value.trim()?"קריאה בלבד — לחץ על המנעול":s===401?"סיסמה שגויה":"שגיאת קריאה "+s,true)}
}

// ---- effective question = base + override ----
const base={},order=[];
DAYS.forEach(d=>d.qs.forEach((q,i)=>{const id=d.day+"-"+(i+1);base[id]={...q,day:d.day,i};order.push(id)}));
const eff=id=>{const o=OVR.data[id];return o&&!o.deleted&&o.q?{...base[id],q:o.q,o:o.o,w:o.w,c:o.c,s:o.s,edBy:o.by,edAt:o.at}:base[id]};

const root=document.getElementById("root");
function renderAll(){
  const open=new Set([...document.querySelectorAll("details.day[open]")].map(d=>d.dataset.day));
  root.innerHTML="";
  DAYS.forEach(d=>{
    const det=document.createElement("details");det.className="day";det.dataset.day=d.day;if(open.has(String(d.day)))det.open=true;
    det.innerHTML=`<summary><span class="n">${d.day<6?"יום "+d.day:"מבחן"}</span><span>${esc(d.title)}</span><span class="cnt" data-day="${d.day}"></span><span class="chev"></span></summary><div class="body"></div>`;
    const body=det.querySelector(".body");
    d.qs.forEach((q,i)=>body.appendChild(card(d.day+"-"+(i+1))));
    root.appendChild(det);
  });
  stats();
}
function card(id){
  const q=eff(id),st=REV.data[id]||{},art=document.createElement("article");
  art.className="card "+(st.v||"");art.id="q"+id;
  const n=(q.day<6?q.day:"מ")+"."+(q.i+1);
  art.innerHTML=`<div class="top"><span class="num">${n}</span><p class="qt">${esc(q.q)}</p>${q.edBy?`<span class="edited" title="${esc(q.edBy)} · ${fmt(q.edAt)}">נערך</span>`:""}<button class="pen" title="עריכה" aria-label="עריכה">✎</button></div>
<ul class="opts">${q.o.map((o,k)=>`<li class="${k===q.c?"c":""}"><span class="l">${L[k]}</span><span>${esc(o)}</span></li>`).join("")}</ul>
<details class="ex"><summary>הסבר ומקור</summary>
<ul class="why">${q.o.map((o,k)=>`<li class="${k===q.c?"c":""}"><span class="l">${L[k]}</span><span>${esc(q.w[k])}</span></li>`).join("")}</ul>
<div class="src"><span class="ref">${esc(q.s[0])}</span>"${esc(q.s[1])}"</div></details>
<div class="foot"><button data-v="ok" class="${st.v==="ok"?"on-ok":""}">מאושר</button><button data-v="fix" class="${st.v==="fix"?"on-fix":""}">דורש תיקון</button><input placeholder="הערה" value="${esc(st.n||"")}"><span class="meta">${st.by?esc(st.by)+" · "+fmt(st.at):""}</span></div>`;
  const meta=()=>{const s=REV.data[id];art.querySelector(".meta").textContent=s&&s.by?s.by+" · "+fmt(s.at):""};
  art.querySelectorAll(".foot button").forEach(b=>b.onclick=()=>{const v=b.dataset.v,cur=(REV.data[id]||{}).v;REV.set(id,{v:cur===v?"":v});
    art.className="card "+(REV.data[id].v||"");art.querySelectorAll(".foot button").forEach(x=>x.className=REV.data[id].v===x.dataset.v?"on-"+x.dataset.v:"");meta();stats()});
  art.querySelector(".foot input").oninput=e=>{REV.set(id,{n:e.target.value});meta()};
  art.querySelector(".pen").onclick=()=>editor(id,art);
  return art;
}
function editor(id,art){
  const q=eff(id);
  const ed=document.createElement("article");ed.className="card";ed.id="q"+id;
  ed.innerHTML=`<div class="ed">
<label>שאלה <span class="hint" data-for="q"></span></label><textarea id="eq">${esc(q.q)}</textarea>
<label>תשובות — סמן את הנכונה. לכל תשובה: נוסח, ומתחתיו ההסבר</label>
${q.o.map((o,k)=>`<div class="row ${k===q.c?"c":""}"><input type="radio" name="c" value="${k}" ${k===q.c?"checked":""}><div><input type="text" class="eo" value="${esc(o)}" placeholder="תשובה ${L[k]}"><span class="hint eoh"></span><textarea class="ew" placeholder="הסבר">${esc(q.w[k])}</textarea></div></div>`).join("")}
<label>מקור — סעיף / נספח</label><input type="text" id="er" value="${esc(q.s[0])}">
<label>ציטוט</label><textarea id="ec">${esc(q.s[1])}</textarea>
<div class="btns"><button id="sv">שמור</button><button class="ghost" id="cx">ביטול</button>${q.edBy?`<button class="warn" id="rs">שחזר למקור</button>`:""}</div>
</div>`;
  const lim=(el,h,max)=>{const f=()=>{h.textContent=el.value.length+"/"+max;h.className="hint"+(el.value.length>max?" over":"")};el.oninput=f;f()};
  lim(ed.querySelector("#eq"),ed.querySelector('[data-for=q]'),120);
  ed.querySelectorAll(".row").forEach(r=>{lim(r.querySelector(".eo"),r.querySelector(".eoh"),75);r.querySelector("input[type=radio]").onchange=()=>ed.querySelectorAll(".row").forEach(x=>x.classList.toggle("c",x.querySelector("input[type=radio]").checked))});
  ed.querySelector("#cx").onclick=()=>ed.replaceWith(card(id));
  ed.querySelector("#sv").onclick=()=>{
    const rows=[...ed.querySelectorAll(".row")];
    const o=rows.map(r=>r.querySelector(".eo").value.trim()),w=rows.map(r=>r.querySelector(".ew").value.trim());
    const c=rows.findIndex(r=>r.querySelector("input[type=radio]").checked);
    const nq=ed.querySelector("#eq").value.trim();
    if(!nq||o.some(x=>!x)||c<0){alert("חסר טקסט שאלה, תשובה, או סימון תשובה נכונה");return}
    OVR.set(id,{q:nq,o,w,c,s:[ed.querySelector("#er").value.trim(),ed.querySelector("#ec").value.trim()],deleted:false});
    ed.replaceWith(card(id));
  };
  const rs=ed.querySelector("#rs");if(rs)rs.onclick=()=>{if(confirm("להחזיר את הנוסח המקורי?")){OVR.del(id);ed.replaceWith(card(id))}};
  art.replaceWith(ed);ed.querySelector("#eq").focus();
}
function stats(){
  let ok=0,fix=0,ed=0;
  DAYS.forEach(d=>{let o=0,f=0;d.qs.forEach((q,i)=>{const s=REV.data[d.day+"-"+(i+1)];if(s&&s.v==="ok")o++;if(s&&s.v==="fix")f++});ok+=o;fix+=f;
    const c=document.querySelector(`.cnt[data-day="${d.day}"]`);if(c)c.innerHTML=`<b>${o}</b>/${d.qs.length}${f?` <i>✎${f}</i>`:""}`;});
  for(const k in OVR.data)if(OVR.data[k].q&&!OVR.data[k].deleted)ed++;
  document.getElementById("stat").textContent=`${order.length} שאלות · מאושר ${ok} · דורש תיקון ${fix} · לא נבדק ${order.length-ok-fix}${ed?` · נערכו ${ed}`:""}`;
}
renderAll();(async()=>{if(!tok.value)await askPassword();pullAll()})();
setInterval(()=>{if(!REV.dirty&&!OVR.dirty&&!document.querySelector(".ed")&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName))pullAll()},30000);
document.getElementById("tog").onclick=e=>{const all=[...document.querySelectorAll("details.day")],o=all.some(d=>!d.open);all.forEach(d=>d.open=o);e.target.textContent=o?"סגור הכל":"פתח הכל"};
document.getElementById("exp").onclick=()=>{
  let out=[];order.forEach(id=>{const s=REV.data[id],q=eff(id);if(s&&(s.v||s.n))out.push(`${q.day<6?"יום "+q.day:"מבחן"} ${q.i+1} — ${s.v==="ok"?"מאושר":s.v==="fix"?"דורש תיקון":"—"}${s.n?" — "+s.n:""}${s.by?" ("+s.by+")":""}\n  ${q.q}`)});
  const t=out.length?out.join("\n"):"אין סימונים עדיין.";
  navigator.clipboard?.writeText(t).then(()=>alert("הועתק ("+out.length+")")).catch(()=>prompt("העתק:",t));
};
